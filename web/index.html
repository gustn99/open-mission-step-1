<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Mission</title>
  </head>
  <body>
    <h1>open mission step 1 - web</h1>

    <form id="purchase-form">
      <div>
        <label for="purchase-amount-input">구매 금액</label>
        <input type="text" id="purchase-amount-input" />
      </div>

      <button type="submit">구매</button>
    </form>

    <div id="purchase-summary-container"></div>

    <form id="winning-numbers-form">
      <div>
        <label for="winning-numbers-input">당첨 번호</label>
        <input type="text" id="winning-numbers-input" />
      </div>

      <div>
        <label for="bonus-number-input">보너스 번호</label>
        <input type="text" id="bonus-number-input" />
      </div>

      <button disabled type="submit">확인</button>
    </form>

    <div id="winning-result-container"></div>

    <button id="restart-button">재시작</button>

    <script type="module" src="./main.js"></script>
  </body>
</html>
